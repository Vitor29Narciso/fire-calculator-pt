[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fire-calculator-pt"
version = "0.1.0"
description = "FIRE calculator tailored for Portugal"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
]

[project.scripts]
fire-cli = "fire_path:run_cli"
fire-web = "fire_path:run_web"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.115",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fire_calculator"]

[dependency-groups]
macos-pth = ["fire-calculator-path-hook"]

[tool.uv]
default-groups = ["macos-pth"]

[tool.uv.sources]
fire-calculator-path-hook = { path = "macos_pth_hook", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-q"
