[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-calculator-pt"
version = "0.1.0"
description = "FIRE calculator tailored for Portugal"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
]

[project.scripts]
fire-calc = "fire_calculator.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-q"
