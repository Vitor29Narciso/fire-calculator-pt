<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FIRE Calculator PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="FIRE chart mark">
          <path
            class="mark-threshold"
            d="M3.5 8.3Q15.2 10.6 29 16.8"
          />
          <path class="mark-portfolio" d="M4.4 27.2C11.7 25.1 16.8 19.1 20 13.2" />
          <circle class="mark-fire" cx="20" cy="13.2" r="2.15" />
        </svg>
        <div>
          <h1>FIRE Calculator</h1>
          <p class="lede">Retire when the lines cross</p>
        </div>
      </div>
      <div class="chrome">
        <div class="switch" role="group" aria-label="Theme">
          <button type="button" class="switch-btn is-on" disabled title="Dark mode">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6.2 1.1a6.8 6.8 0 0 0 8.7 8.7 6.4 6.4 0 1 1-8.7-8.7z"
              />
            </svg>
          </button>
          <button type="button" class="switch-btn" disabled title="Light mode">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 3.2a.7.7 0 0 1-.7-.7V1.4a.7.7 0 1 1 1.4 0v1.1a.7.7 0 0 1-.7.7zm0 9.6a.7.7 0 0 1 .7.7v1.1a.7.7 0 1 1-1.4 0v-1.1a.7.7 0 0 1 .7-.7zM3.2 8a.7.7 0 0 1-.7.7H1.4a.7.7 0 1 1 0-1.4h1.1a.7.7 0 0 1 .7.7zm11.5.7h-1.1a.7.7 0 1 1 0-1.4h1.1a.7.7 0 1 1 0 1.4zM4.4 4.4a.7.7 0 0 1-1 0l-.8-.8a.7.7 0 1 1 1-.9l.8.7a.7.7 0 0 1 0 1zm8.2 8.2a.7.7 0 0 1 0-1l.8-.8a.7.7 0 1 1 1 1l-.8.8a.7.7 0 0 1-1 0zm0-8.2a.7.7 0 0 1 1 0l.8-.8a.7.7 0 1 1-1-1l-.8.8a.7.7 0 0 1 0 1zM4.4 11.6a.7.7 0 0 1 0 1l-.8.8a.7.7 0 1 1-1-1l.8-.8a.7.7 0 0 1 1 0zM8 5.1A2.9 2.9 0 1 1 5.1 8 2.9 2.9 0 0 1 8 5.1z"
              />
            </svg>
          </button>
        </div>
        <div class="switch" role="group" aria-label="Language">
          <button type="button" class="switch-btn" disabled>PT</button>
          <button type="button" class="switch-btn is-on" disabled>EN</button>
        </div>
      </div>
    </header>

    <form id="inputs" class="panel">
      <h2>Your Plan</h2>

      <div class="grid">
        <label class="field">
          <span>Current age</span>
          <input type="number" id="current_age" min="1" max="80" />
        </label>
        <label class="field">
          <span>Life expectancy</span>
          <input type="number" id="life_expectancy" min="50" max="120" />
        </label>
        <label class="field">
          <span>Monthly contribution (€)</span>
          <input type="number" id="monthly_contribution" min="0" step="50" />
        </label>
        <label class="field">
          <span>Initial balance (€)</span>
          <input type="number" id="initial_balance" min="0" step="1000" />
        </label>
        <label class="field">
          <span>Desired net / month (€)</span>
          <input type="number" id="desired_monthly_net_income" min="1" step="50" />
        </label>
        <label class="field slider">
          <span>Annual ROI <em id="annual_roi_label"></em></span>
          <input type="range" id="annual_roi" min="0" max="0.15" step="0.005" />
        </label>
        <label class="field slider">
          <span>Inflation <em id="inflation_rate_label"></em></span>
          <input type="range" id="inflation_rate" min="0" max="0.10" step="0.005" />
        </label>
        <label class="field slider">
          <span>Management fee <em id="management_fee_rate_label"></em></span>
          <input type="range" id="management_fee_rate" min="0" max="0.02" step="0.0001" />
        </label>
        <label class="field slider">
          <span>Gains tax <em id="gains_tax_rate_label"></em></span>
          <input type="range" id="gains_tax_rate" min="0" max="0.40" step="0.001" />
        </label>
      </div>
    </form>

    <section class="stats" id="stats">
      <article class="stat">
        <p class="stat-label">FIRE age</p>
        <p class="stat-value" id="fire-age">—</p>
      </article>
      <article class="stat">
        <p class="stat-label">FIRE in</p>
        <p class="stat-value" id="fire-in">Calculating…</p>
      </article>
      <article class="stat">
        <p class="stat-label">Portfolio at FIRE</p>
        <p class="stat-value" id="fire-portfolio">—</p>
      </article>
      <article class="stat stat-ss">
        <p class="stat-label" id="ss-label">Ahead of SS</p>
        <p class="stat-value" id="ss-ahead">—</p>
        <p class="stat-hint" id="ss-hint">Legal age 66y 9m</p>
      </article>
    </section>

    <section class="panel chart-panel">
      <h2>Your Projection</h2>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Year-by-year</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Year</th>
              <th>Age</th>
              <th>Invested</th>
              <th>Portfolio</th>
              <th>Needed to retire</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

    <script src="/static/app.js"></script>
  </body>
</html>
